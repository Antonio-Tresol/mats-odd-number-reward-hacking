[project]
name = "odd-number"
version = "0.1.0"
description = "Model Forensics take-home: why do models output an odd number when the in-context grader rewards odd?"
requires-python = ">=3.13"
dependencies = ["httpx>=0.27"]

[project.scripts]
odd-number = "odd_number.cli:main"

[dependency-groups]
# uv installs the `dev` group automatically for `uv run` inside a project, so
# `uv run pytest` needs no --with flags.
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/odd_number"]
